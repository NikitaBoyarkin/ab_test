[project]
name = "ab-testing-toolkit"
version = "0.1.0"
description = "Empirical A/B testing methodology toolkit — sequential testing, CUPED, ratio metrics, HTE, and calibration-driven validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "plotnine",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
